[workspace]
members = ["crates/signer-core", "crates/signer-daemon"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/egg5233/clmm-copybot"

[workspace.dependencies]
signer-core = { path = "crates/signer-core" }

aes-gcm = "0.10"
base64 = "0.22"
bincode = "1"
bs58 = "0.5"
dotenvy = "0.15"
hex = "0.4"
regex = "1"
rpassword = "7"
scrypt = "0.11"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
solana-account = "2.2"
solana-address-lookup-table-interface = { version = "2.2", features = ["bincode", "bytemuck"] }
solana-client = "2.3"
solana-sdk = "2"
thiserror = "2"
tiny_http = "0.12"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
